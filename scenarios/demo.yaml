# Demo: about 2 minutes at 20x, sounds in quick succession, real recordings throughout.
# Clips are real ESC-50 / UrbanSound8K recordings under data/ (git-ignored, CC BY-NC; fetch with
# training's dataset download). Every false alarm here is one the shipped classifier really makes:
# an insect swarm it calls "chainsaw", a helicopter it calls "vehicle". Four incidents for the
# agent: insects (false alarm), a logging crew (real), a helicopter (benign), poachers (real).
# Run with `uv run python -m eval.demo` (see eval/demo.py). Times are station-local; quote them.
title: Demo (2 min)
date: 2026-11-14
start: "02:00"
end: "02:38"
speed: 20

weather:
  - {at: "02:00", sectors: all, rain: false, wind_kph: 6}
  - {at: "02:00", sectors: "A1:B5", rain: true, wind_kph: 20}

# What the drone camera sees over a sector (default: "no activity seen").
drone:
  - {sector: E4, see: "fresh clearing, chainsaw crew of three, one truck", from: "02:00", until: "02:38"}
  - {sector: D2, see: "two people with rifles beside a pickup", from: "02:20", until: "02:38"}

events:
  # ~2 s in: a swarm of insects by El Bajo's microphone. The classifier hears a chainsaw.
  - {at: "02:00:40", node: El Bajo, sound: chainsaw, confidence: 0.85, duration: 5,
     source: insects, label: false_alarm, incident: insects,
     clip: ESC-50-master/audio/5-194932-A-7.wav, note: insect swarm}

  # ~10 s in: a real chainsaw in dry sectors, heard by three nodes within 20 s.
  - {at: "02:03:20", node: Arroyo Recodo, sound: chainsaw, confidence: 0.93, duration: 5,
     source: chainsaw, label: real, incident: logging, clip: ESC-50-master/audio/1-116765-A-41.wav}
  - {at: "02:03:30", node: Paso Musgo, sound: chainsaw, confidence: 0.88, duration: 5,
     source: chainsaw, label: real, incident: logging, clip: ESC-50-master/audio/1-19898-A-41.wav}
  - {at: "02:03:40", node: Brecha Vieja, sound: chainsaw, confidence: 0.90, duration: 5,
     source: chainsaw, label: real, incident: logging, clip: ESC-50-master/audio/1-19898-B-41.wav}

  # ~25 s in: a helicopter passes over the north ridge. The classifier calls it a vehicle.
  - {at: "02:08:20", node: Loma Este, sound: vehicle, confidence: 0.84, duration: 5,
     source: helicopter, label: benign, incident: aircraft,
     clip: ESC-50-master/audio/5-177957-C-40.wav, note: helicopter overhead}

  # ~33 s in: the saw again, then a truck comes for the logs.
  - {at: "02:11:00", node: Arroyo Recodo, sound: chainsaw, confidence: 0.95, duration: 5,
     source: chainsaw, label: real, incident: logging, clip: ESC-50-master/audio/1-19898-C-41.wav}
  - {at: "02:13:20", node: Brecha Vieja, sound: vehicle, confidence: 0.86, duration: 5,
     source: truck, label: real, incident: logging, clip: ESC-50-master/audio/1-22882-A-44.wav}

  # ~60 s in: gunshots near the south post, heard by two dry nodes, then a vehicle leaving.
  - {at: "02:20:00", node: Ceibal, sound: gunshot, confidence: 0.94, duration: 3,
     source: gunshot, label: real, incident: poaching, clip: UrbanSound8K/audio/fold9/106955-6-0-0.wav}
  - {at: "02:20:04", node: Puesto Sur, sound: gunshot, confidence: 0.88, duration: 3,
     source: gunshot, label: real, incident: poaching, clip: UrbanSound8K/audio/fold3/110622-6-0-0.wav}
  - {at: "02:23:20", node: Puesto Sur, sound: vehicle, confidence: 0.84, duration: 5,
     source: truck, label: real, incident: poaching, clip: ESC-50-master/audio/1-18527-B-44.wav}

# Already on the list when the run starts: one finished incident from earlier in the night, so a
# case file can be opened at any moment (station/demo_seed.py). Records are signed like live ones.
earlier:
  minutes_before: 150
  sound: chainsaw
  nodes: [Hondonada, Loma Norte]
  seen: "two people cutting a felled cedar, a motorbike on the track"
