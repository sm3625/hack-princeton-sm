# Southern Cardamom NP, Koh Kong, Cambodia: steep monsoon-soaked ridges, many small ranger stations.
# Map, terrain, posts and scenarios: sites/southern_cardamom/.
site:
  name: Peam Piphot valley, Southern Cardamom
  description: Steep wet ridges above Chi Phat. No drone (ridge cloud, monsoon gusts); stations patrol day and night.
map: southern_cardamom
drones:
  count: 0              # cloud on the ridges and monsoon gusts ground small drones most nights
ranger_teams:
  count: 3              # stations patrol day and night
  response_min: 60
connectivity: lora      # ridge repeaters; no mobile signal in the valley
approval:
  approver: station chief
agent:
  max_followup_checks: 4
  check_interval_min: 20  # heavy rain comes and goes fast; re-check sooner
