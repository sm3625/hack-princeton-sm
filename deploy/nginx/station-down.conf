# Paste inside the station's `server { listen 443 ... }` block.
# While the station is restarting, visitors see a page that reloads itself
# when /api/health answers again, instead of nginx's "502 Bad Gateway".
error_page 502 503 504 /station-down.html;
location = /station-down.html {
    root /var/www;
    internal;
    add_header Cache-Control "no-store" always;
}
