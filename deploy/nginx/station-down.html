<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forest Guardian</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #f5f5f7; color: #1d1d1f;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
  p { margin: 6px 0; text-align: center; }
  .muted { color: #6e6e73; font-size: 14px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #2f7d4f; margin-right: 8px; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-color-scheme: dark) {
    body { background: #000; color: #f5f5f7; } .muted { color: #98989d; } }
</style>
</head>
<body>
<div>
  <p><span class="dot"></span>Station restarting</p>
  <p class="muted">Reconnecting automatically</p>
</div>
<script>
  setInterval(async () => {
    try {
      const r = await fetch("/api/health", { cache: "no-store" });
      if (r.ok) location.reload();
    } catch (e) {}
  }, 3000);
</script>
</body>
</html>
