# Night 1 (Gunung Leuser, Bukit Lawang edge). Times are station-local; after midnight is the next day.
# A storm sits over the north-west hills before midnight; a dawn shower covers everything.
# Two real incidents:
#  - encroachment: a chainsaw crew clears forest at the boundary (E5 farm side, C5/D4 park side) at
#    01:40, outside the plantation's chainsaw hours, then a vehicle comes for the seedlings.
#  - poaching: shots in the steep north-west hills (B8/D7); drone can see it, rangers walk far.
# Noise: plantation harvest trucks at night (lawful in the zone), a lodge motorbike, 10 storm false
# alarms on the hill nodes, a branch fall read as a gunshot, 4 dawn-rain false alarms, and an early
# replanting crew's chainsaw inside lawful hours.
