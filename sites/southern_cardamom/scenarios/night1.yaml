# Night 1 (Southern Cardamom). Times are station-local. Events after midnight belong to the next day.
# The south-west monsoon soaks the windward west slopes (A-D) most of the night, then the east (E-H)
# for a shorter burst. Two real incidents:
#  - rosewood: chainsaw on the far ridge (E7/F7), heard by two dry nodes and one in the rain. The drone
#    cannot reach it with its reserve and G8 is no-fly: rangers must climb (steep terrain, long ETA).
#  - hunting: shots and a motorbike on the old logging road (F4), within drone range.
# Noise: 15 rain/thunder false alarms on the west slopes, a ranger patrol boat on the river heard by
# three nodes, hornbill wingbeats read as a chainsaw, and lawful community motorbikes and axes at dawn.
