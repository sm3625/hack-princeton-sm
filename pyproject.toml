[project]
name = "forest-guardian"
version = "0.1.0"
description = "Offline acoustic sensors + an incident-commander agent against illegal logging"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "pynacl>=1.6.2",
    "sounddevice>=0.5.6",
    "librosa>=1.0.1",
    "ai-edge-litert>=2.3.0",
    "deepagents>=0.7.38",
    "langchain-ollama>=1.1.0",
    "langchain-anthropic>=1.7.10",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "markdown>=3.11.3",
    "nh3>=0.3.7",
    "google-genai>=3.3.0",
    "langchain-google-genai>=4.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "playwright>=1.65.2",
    "pytest-asyncio>=1.5.0",
]
train = [
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "tensorflow>=2.21.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "ollama: needs a running local Ollama model",
    "haiku: calls the Claude API and costs money",
    "e2e: starts the real station process and plays a scenario (slow, make test-e2e)",
]
addopts = "-m 'not ollama and not haiku and not e2e'"

[tool.ruff]
line-length = 100
target-version = "py312"
